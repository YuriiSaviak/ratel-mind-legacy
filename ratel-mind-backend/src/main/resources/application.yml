spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ratel_mind_legacy}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:ura123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8081}

# APP_CORS_ALLOWED_ORIGINS=http://localhost:5174,https://ratelmind.com
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  email-receiver: ${EMAIL_RECEIVER:}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openai/gpt-4o}
  site-url: ${OPENROUTER_SITE_URL:}
  site-name: ${OPENROUTER_SITE_NAME:Ratel Mind}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.4-mini}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
